name: Portable ANN checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure portable tests
        run: cmake -S . -B build_host -DANN_HOST_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build host models
        run: cmake --build build_host --parallel 2
      - name: Check grouping, transport, plotting and energy analysis
        run: ctest --test-dir build_host --output-on-failure
      - name: Check external runtime integration
        run: python -B tools/test_project_setup.py
